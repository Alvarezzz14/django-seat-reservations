name: django-seat-reservations

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: reservations
      DB_USER: reservations
      DB_PASSWORD: local-only-password
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
